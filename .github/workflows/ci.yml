name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn package -DskipTests

      - name: CLI smoke test – folder download
        run: |
          JAR=$(ls target/MegaBasterd-*-jar-with-dependencies.jar | head -1)
          mkdir -p /tmp/mega_test
          java -jar "$JAR" --cli \
            --url "https://mega.nz/folder/FxAmhbRJ#Dwugf8isRSR9CCZ6Qnza4w" \
            --output /tmp/mega_test
          echo "--- downloaded files ---"
          ls -lh /tmp/mega_test
          # fail if nothing was downloaded
          [ "$(ls -A /tmp/mega_test)" ] || { echo "ERROR: no files downloaded"; exit 1; }
